appId: app.tencut.desktop
productName: TenCut
copyright: Copyright © 2026 TenCut
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  # onnxruntime-node ships every platform's binaries (~300 MB); each platform section below drops the ones
  # it doesn't need. Linux binaries are never needed.
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
extraResources:
  - from: resources/models
    to: models
    filter: ['*.onnx', 'README.md']
  # ffprobe for this platform, downloaded by scripts/fetch-ffprobe.mjs (same FFmpeg release as ffmpeg-static).
  - from: resources/bin
    to: bin
asarUnpack:
  # Executables can't run from inside an asar archive.
  - node_modules/ffmpeg-static/**
  # Native ONNX Runtime addon + its libraries must be real files.
  - node_modules/onnxruntime-node/**
  # Analysis runs in a utilityProcess + worker_threads; keep their modules as real files.
  - out/main/**

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.video
  icon: resources/icon.png
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/x64/**'
  # Ad-hoc signature (no Apple Developer ID): runs on Apple Silicon Macs; Gatekeeper asks once
  # (right-click → Open). Proper distribution needs a Developer ID identity + notarization
  # (then turn hardenedRuntime back on).
  identity: '-'
  hardenedRuntime: false
dmg:
  title: TenCut ${version}
  artifactName: TenCut-${version}-${arch}.dmg

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  # Unsigned: Windows SmartScreen shows "unknown publisher" (More info → Run anyway) until a
  # code-signing certificate is configured (CSC_LINK / CSC_KEY_PASSWORD secrets).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: TenCut-Setup-${version}-${arch}.${ext}

linux:
  target: AppImage
