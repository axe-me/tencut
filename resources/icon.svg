<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5aa8"/>
      <stop offset="1" stop-color="#16315f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    
    <radialGradient id="ball-felt" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f1fb7a"/>
      <stop offset="0.45" stop-color="#d4ea2f"/>
      <stop offset="1" stop-color="#93ad12"/>
    </radialGradient>
    <clipPath id="ball-disc"><circle cx="512" cy="512" r="262"/></clipPath>
    <g id="ball">
      <circle cx="512" cy="512" r="262" fill="url(#ball-felt)"/>
      <g clip-path="url(#ball-disc)" fill="none" stroke="#fbfdf2" stroke-width="22.270000000000003" stroke-linecap="round">
        <circle cx="202.84000000000003" cy="512" r="243.66000000000003"/>
        <circle cx="821.16" cy="512" r="243.66000000000003"/>
      </g>
    </g>
    <clipPath id="ball-s0"><rect x="250" y="248" width="131" height="528"/></clipPath><clipPath id="ball-s1"><rect x="381" y="248" width="131" height="528"/></clipPath><clipPath id="ball-s2"><rect x="512" y="248" width="131" height="528"/></clipPath><clipPath id="ball-s3"><rect x="643" y="248" width="131" height="528"/></clipPath>
  </defs>
  <!-- macOS icon grid: 824² rounded square centred on a 1024² canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- court line hint -->
  <rect x="100" y="742" width="824" height="10" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="512" cy="808" rx="275.1" ry="26" fill="#050b18" opacity="0.45" filter="url(#shadow)"/>
  <g transform="translate(-45 -14)"><g clip-path="url(#ball-s0)"><use href="#ball"/></g></g><g transform="translate(-15 8)"><g clip-path="url(#ball-s1)"><use href="#ball"/></g></g><g transform="translate(15 -8)"><g clip-path="url(#ball-s2)"><use href="#ball"/></g></g><g transform="translate(45 14)"><g clip-path="url(#ball-s3)"><use href="#ball"/></g></g>
</svg>